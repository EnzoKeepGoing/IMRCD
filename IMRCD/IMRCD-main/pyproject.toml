[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imrcd"
version = "1.0.0"
description = "Interaction Memory Retrieval for Cognitive Diagnosis"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["imrcd*"]
